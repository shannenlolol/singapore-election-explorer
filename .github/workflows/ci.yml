name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm test --prefix backend
      - run: npm run test:integration --prefix backend
        env:
          TEST_DB_PORT: 3306
          TEST_DB_PASSWORD: fixture-only
      - run: npm test --prefix frontend
      - run: npm run test:ui --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: dash/requirements.txt
      - run: pip install -r dash/requirements.txt
      - run: python -m py_compile dash/app.py
      - run: cd dash && python -c 'from app import app; assert app.server.test_client().get("/dash/").status_code == 200'
      - run: python -m unittest discover -s dash -p 'test_*.py'
